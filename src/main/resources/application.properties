spring.application.name=finance-flow-api
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:financeflow}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.jpa.open-in-view=false

app.bootstrap.admin-token=${APP_BOOTSTRAP_ADMIN_TOKEN:}
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:bootstrap-admin}
